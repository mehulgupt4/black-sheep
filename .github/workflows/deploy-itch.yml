name: Deploy to Itch.io

on:
  release:
    types: [published] # Triggers when you publish a new release on GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish to Itch.io
        uses: Ovall-Tutu/publish-to-itch-with-butler@v1
        with:
          api-key: ${{ secrets.ITCH_API_KEY }}
          itch_user: mehu1
          itch_game: black-sheep
          channel: html5 # Or windows, linux, osx, etc.
          package: .
